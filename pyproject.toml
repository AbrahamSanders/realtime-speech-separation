[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-speech-separation"
version = "0.1.0"
description = "Realtime speech separation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "librosa>=0.10.2",
    "numpy>=1.26",
    "soundfile>=0.12",
    "tqdm>=4.66",
]

[project.scripts]
"rtss.separate" = "realtime_speech_separation.inference_cli:main"
"rtss.client" = "realtime_speech_separation.inference_client:main"
"rtss.eval" = "realtime_speech_separation.eval_cli:main"

[project.optional-dependencies]
inference = [
    "codec-bpe[magicodec]>=1.4.1",
    "llama-cpp-python>=0.3",
    "matplotlib>=3.8",
    "torch>=2.2",
    "transformers>=5.17,<6",
]
client = [
    "realtime-speech-separation[inference]",
    "gradio>=5,<6",
]
eval = [
    "pystoi>=0.4.1",
    "silero-vad>=6.2.1",
    "torch>=2.2",
    "torchmetrics>=1.8.2",
]
training = [
    "accelerate>=1",
    "codec-bpe[magicodec]>=1.4.1",
    "datasets>=2.14",
    "evaluate>=0.4",
    "torch>=2.2",
    "transformers>=5.17,<6",
]
data = [
    "codec-bpe[magicodec]>=1.4.1",
    "jsonlines>=4",
    "pandas>=2.2",
    "silero-vad>=5",
    "streamlit>=1.32",
    "torch>=2.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers"
markers = ["metric_backend: opt-in tests using installed metric runtimes"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
