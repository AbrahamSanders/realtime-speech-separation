[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-speech-separation"
version = "0.1.0"
description = "Realtime speech separation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "librosa>=0.10.2",
    "numpy>=1.26",
    "tabulate>=0.9",
]

[project.scripts]
rtss.separate = "realtime_speech_separation.inference_cli:main"
rtss.client = "realtime_speech_separation.inference_client:main"
rtss.eval = "realtime_speech_separation.eval_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
